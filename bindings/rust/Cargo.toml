[package]
name = "graphqlite"
version = "0.6.1"
edition = "2021"
description = "SQLite extension for graph queries using Cypher"
license = "MIT"
repository = "https://github.com/colliery-io/graphqlite"
readme = "README.md"
keywords = ["sqlite", "graph", "cypher", "database"]
categories = ["database"]
exclude = ["tests/", "target/"]
include = ["src/**/*", "libs/**/*", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
rusqlite = { version = ">=0.31", features = ["bundled", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# No build dependencies - pre-built binaries are embedded via include_bytes!()

[dev-dependencies]
tempfile = "3.10"
# The parity_runner example (issue #84) parses the shared scenarios.json and must
# preserve object key order so the Cypher it drives the binding to emit matches
# the TS/Python runners byte-for-byte (JS objects and Python dicts both keep
# insertion order). Dev-only: published production builds never pull this in.
serde_json = { version = "1.0", features = ["preserve_order"] }

[features]
default = ["bundled-extension"]
bundled-extension = []  # Bundle the compiled extension (recommended)
# Opt-in Cypher recording sink used only by the parity harness (issue #84).
# Off by default → production builds are byte-identical to before. The
# parity_runner example builds with `--no-default-features --features parity-spy`
# so it loads the extension via GRAPHQLITE_EXTENSION_PATH (shared dylib) and can
# capture the emitted Cypher for cypher-mode parity.
parity-spy = []
